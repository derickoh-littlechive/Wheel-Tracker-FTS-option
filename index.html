<style>
:root{--bg:#07131f;--card:#0e2438;--card2:#122d45;--text:#f5f8fb;--muted:#91a8bb;--line:#1e405a;--green:#35e09a;--red:#ff6b6b;--blue:#69b8ff;--amber:#f4c95d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#05101a,#0b2032);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}.app{max-width:1150px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:800}.muted,.note{color:var(--muted);font-size:12px}.nav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.nav button,.btn{background:var(--card);border:1px solid var(--line);color:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.active,.primary{background:var(--green)!important;color:#052016!important;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:rgba(14,36,56,.97);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px}.label{color:var(--muted);font-size:11px}.value{font-size:22px;font-weight:800;margin-top:4px}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px}.kpi{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.kpi:last-child{border:0}.pill{padding:4px 8px;border-radius:20px;background:#12364e;font-size:10px}.status-open{color:var(--blue)}.status-good{color:var(--green)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted)}.wrap{overflow:auto}.wrap table{min-width:850px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{color:var(--muted);font-size:11px}input,select,textarea{width:100%;margin-top:5px;padding:10px;background:#081a29;color:#fff;border:1px solid var(--line);border-radius:8px}.full{grid-column:1/-1}.actions{text-align:right;margin-top:12px}.empty{text-align:center;padding:26px;color:var(--muted)}.timeline{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:10px 0}.step{background:#12344b;border:1px solid var(--line);padding:8px 10px;border-radius:9px;font-size:11px}.arrow{color:var(--muted)}.bar{height:8px;background:#12324a;border-radius:20px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--green)}.mini{font-size:11px}.danger{border-color:#69303b!important;background:#341c25!important}@media(max-width:760px){.grid,.three{grid-template-columns:1fr 1fr}.two,.form{grid-template-columns:1fr}.full{grid-column:auto}}

<style>
.price-input{background:#07131f;border:1px solid #24445c;color:#fff;border-radius:8px;padding:8px 9px;font-size:14px}
.price-input:focus{outline:2px solid #35d79a;border-color:#35d79a}
.step-date{display:block;margin-top:6px;color:#7fa7c6;font-size:12px;font-weight:500}</style>
</style></head><body><div class="app">
<div class="top"><div><div class="brand">◉ Wheel Tracker <span class="pill">V11 PORTFOLIO</span></div><div class="muted">Wheel lifecycle • cost basis • premium ROI • expiry management</div></div><button id="installBtn" class="btn" style="display:none" onclick="installApp()">Install</button><button class="btn primary" onclick="view('add')">+ Add Trade</button></div>
<div class="nav"><button id="home" onclick="view('home')">Home</button><button id="positions" onclick="view('positions')">Positions</button><button id="wheel" onclick="view('wheel')">Wheel</button><button id="leaps" onclick="view('leaps')">LEAPS</button><button id="spreads" onclick="view('spreads')">Spreads</button><button id="income" onclick="view('income')">Income</button><button id="expiry" onclick="view('expiry')">Expiry</button><button id="calc" onclick="view('calc')">What-If</button><button id="reports" onclick="view('reports')">Reports</button><button id="tx" onclick="view('tx')">Trades</button><button id="more" onclick="view('more')">More</button></div><div id="v"></div></div>
<script>
const KEY='wheeltracker_v6';
let D=JSON.parse(localStorage.getItem(KEY)||'null')||{trades:[
{id:1,type:'CSP',ticker:'AAPL',strike:200,contracts:1,premium:500,closeCost:0,fees:20,status:'Assigned',date:'2026-09-15',expiry:'2026-10-16',wheel:'AAPL-001'},
{id:2,type:'ASSIGN',ticker:'AAPL',strike:200,shares:100,premium:0,closeCost:0,fees:0,status:'Open',date:'2026-10-16',wheel:'AAPL-001'},
{id:3,type:'CC',ticker:'AAPL',strike:210,contracts:1,premium:700,closeCost:0,fees:20,status:'Open',date:'2026-10-16',expiry:'2026-11-20',wheel:'AAPL-001'}],prices:{AAPL:195}};
const $=s=>document.querySelector(s), money=n=>'$'+(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}), pct=n=>((+n||0)*100).toFixed(2)+'%';
function save(){localStorage.setItem(KEY,JSON.stringify(D))} function stocks(){return[...new Set(D.trades.map(x=>x.ticker).filter(Boolean))]}
function M(t){
  const a=D.trades.filter(x=>x.ticker===t);
  let put=0,call=0,btc=0,fees=0,acqCost=0,acqShares=0,soldShares=0,proceeds=0;
  a.forEach(x=>{
    fees+=+x.fees||0;
    if(x.type==='CSP')put+=+x.premium||0;
    if(x.type==='CC')call+=+x.premium||0;
    if(x.type==='BTC')btc+=+x.closeCost||0;
    if(['ASSIGN','BUY'].includes(x.type)){
      const q=+x.shares||0;
      acqShares+=q;
      acqCost+=q*(+x.strike||0);
    }
    if(['SELL','CALLED'].includes(x.type)){
      const q=+x.shares||0;
      soldShares+=q;
      proceeds+=q*(+x.strike||0);
    }
  });
  const shares=Math.max(0,acqShares-soldShares);
  const avgAcq=acqShares?acqCost/acqShares:0;
  const closedCost=Math.min(acqCost,soldShares*avgAcq);
  const openCost=Math.max(0,acqCost-closedCost);
  const premium=put+call-btc-fees;
  const adj=openCost-premium;
  const price=+D.prices[t]||0;
  const market=shares*price;
  const stockUnreal=market-openCost;
  const realizedStock=proceeds-closedCost;
  const total=stockUnreal+realizedStock+premium;
  return{
    put,call,btc,fees,cost:openCost,premium,adj,shares,price,market,
    stockUnreal,realizedStock,total,
    unreal:stockUnreal,
    ps:shares?adj/shares:0
  };
}

function setPrice(t,v){
  const n=parseFloat(v);
  if(!Number.isFinite(n)||n<0){
    alert('Enter a valid stock price.');
    return;
  }
  D.prices[t]=n;
  save();
  view('positions');
}
function nav(id){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if($('#'+id))$('#'+id).classList.add('active')}
function table(){
  if(!stocks().length)return'<div class="empty">No trades yet.</div>';
  return'<div class="wrap"><table><tr><th>Stock</th><th>Shares</th><th>Actual Cost</th><th>Net Premium</th><th>Adjusted Cost</th><th>Adj./Share</th><th>Current Price</th><th>Stock Unrealized</th><th>Total Wheel P/L</th></tr>'+
  stocks().map(t=>{
    let x=M(t);
    return`<tr>
      <td><b>${t}</b></td>
      <td>${x.shares}</td>
      <td>${money(x.cost)}</td>
      <td class="green">${money(x.premium)}</td>
      <td>${money(x.adj)}</td>
      <td>${money(x.ps)}</td>
      <td><div style="display:flex;gap:6px;align-items:center;min-width:190px"><input id="price_${t.replace(/[^a-zA-Z0-9_-]/g,'_')}" class="price-input" type="number" step=".01" min="0" value="${x.price||''}" placeholder="Price"><button class="btn" type="button" onclick="setPrice('${t}',document.getElementById('price_${t.replace(/[^a-zA-Z0-9_-]/g,'_')}').value)">Save</button></div></td>
      <td class="${x.stockUnreal>=0?'green':'red'}">${money(x.stockUnreal)}</td>
      <td class="${x.total>=0?'green':'red'}"><b>${money(x.total)}</b></td>
    </tr>`
  }).join('')+'</table></div>'
}

let liveTimer=null;
let liveBusy=false;
const LIVE_INTERVAL=60000;

function yahooTarget(t){
  return 'https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(t)+'?range=1d&interval=1m';
}
function liveStatus(msg,ok=true){
  const el=document.getElementById('liveStatus');
  if(el){el.textContent=msg;el.className=ok?'green':'red';}
}
async function fetchJson(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return await r.json();
}
async function fetchLivePrice(t){
  const target=yahooTarget(t);
  const urls=[
    'https://corsproxy.io/?url='+encodeURIComponent(target),
    'https://api.allorigins.win/raw?url='+encodeURIComponent(target)
  ];
  let lastErr;
  for(const u of urls){
    try{
      const j=await fetchJson(u);
      const q=j&&j.chart&&j.chart.result&&j.chart.result[0]&&j.chart.result[0].meta;
      const p=Number(q&&(q.regularMarketPrice??q.previousClose));
      if(Number.isFinite(p)&&p>0)return p;
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error('No quote returned');
}
async function refreshLivePrices(){
  if(liveBusy)return;
  const syms=stocks();
  if(!syms.length){liveStatus('Add a position to enable live prices.');return}
  liveBusy=true;
  liveStatus('Updating prices…');
  let ok=0;
  for(const t of syms){
    try{
      const p=await fetchLivePrice(t);
      D.prices[t]=p;
      ok++;
    }catch(e){console.warn('Live quote failed for '+t,e)}
  }
  save();
  liveBusy=false;
  liveStatus(ok===syms.length?'Prices updated • auto-refresh every 60 sec':
    `${ok}/${syms.length} prices updated • internet quote unavailable for some symbols`,ok>0);
  if(typeof page!=='undefined'&&page==='positions')view('positions');
}
function startLivePrices(){
  if(liveTimer)clearInterval(liveTimer);
  liveTimer=setInterval(refreshLivePrices,LIVE_INTERVAL);
}


function strategyOf(x){
  if(x.strategy)return x.strategy;
  if(['CSP','CC','ASSIGN','CALLED'].includes(x.type))return 'Wheel';
  return 'Other';
}
function optionTrades(strategy){
  return D.trades.filter(x=>strategyOf(x)===strategy);
}
function optionNet(rows){
  return rows.reduce((a,x)=>{
    const p=+x.premium||0, btc=+x.closeCost||0, f=+x.fees||0;
    if(x.type==='BUY') return a-p-btc-f;
    if(x.type==='SELL'||x.type==='CSP'||x.type==='CC') return a+p-btc-f;
    if(x.type==='BTC') return a-btc-f;
    return a+p-btc-f;
  },0);
}
function strategyCash(strategy){return optionNet(optionTrades(strategy))}
function moneySigned(n){return (n>=0?'+':'')+money(n)}

function wheelIncForReport(){return D.trades.filter(x=>strategyOf(x)==='Wheel').reduce((a,x)=>a+((x.type==='CSP'||x.type==='CC')?(+x.premium||0):0)-(+x.closeCost||0)-(+x.fees||0),0)}
function days(exp){if(!exp)return null;return Math.ceil((new Date(exp+'T23:59:59')-new Date())/86400000)}
function view(page,editId){nav(page);let v=$('#v'),p=stocks().map(M),prem=p.reduce((a,x)=>a+x.premium,0),market=p.reduce((a,x)=>a+x.market,0),adj=p.reduce((a,x)=>a+x.adj,0),pl=p.reduce((a,x)=>a+x.total,0);
if(page==='home'){let wheelRows=optionTrades('Wheel'),leapRows=optionTrades('LEAPS'),spreadRows=optionTrades('Vertical Spread'),wheelInc=wheelRows.reduce((a,x)=>a+(x.type==='CSP'||x.type==='CC'?+x.premium||0:0)-(+x.closeCost||0)-(+x.fees||0),0),leapCash=strategyCash('LEAPS'),spreadCash=strategyCash('Vertical Spread'),totalIncome=wheelInc+leapCash+spreadCash;v.innerHTML=`<div class="grid"><div class="card"><div class="label">Portfolio Option Cash Flow</div><div class="value ${totalIncome>=0?'green':'red'}">${moneySigned(totalIncome)}</div></div><div class="card"><div class="label">Wheel</div><div class="value green">${moneySigned(wheelInc)}</div></div><div class="card"><div class="label">LEAPS</div><div class="value ${leapCash>=0?'green':'red'}">${moneySigned(leapCash)}</div></div><div class="card"><div class="label">Vertical Spreads</div><div class="value ${spreadCash>=0?'green':'red'}">${moneySigned(spreadCash)}</div></div></div><div class="two"><div class="card"><h2>Portfolio Strategy Mix</h2><div class="kpi"><span>Wheel trades</span><b>${wheelRows.length}</b></div><div class="kpi"><span>LEAPS trades</span><b>${leapRows.length}</b></div><div class="kpi"><span>Vertical spread legs</span><b>${spreadRows.length}</b></div><div class="kpi"><span>Total option records</span><b>${wheelRows.length+leapRows.length+spreadRows.length}</b></div></div><div class="card"><h2>Wheel Snapshot</h2><div class="kpi"><span>Active shares</span><b>${p.reduce((a,x)=>a+x.shares,0)}</b></div><div class="kpi"><span>Wheel premium</span><b class="green">${money(wheelInc)}</b></div><div class="kpi"><span>Wheel cycles</span><b>${new Set(D.trades.map(x=>x.wheel).filter(Boolean)).size}</b></div><div class="kpi"><span>Open stock P/L</span><b class="${pl>=0?'green':'red'}">${money(pl)}</b></div></div></div><div class="card"><h2>Recent Portfolio Activity</h2>${D.trades.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||((+b.id||0)-(+a.id||0))).slice(0,10).map(x=>`<div class="kpi"><span>${x.date||''} · <b>${x.ticker}</b> · ${strategyOf(x)}</span><b>${x.type} ${moneySigned((x.type==='BUY'?-1:1)*((+x.premium||0)-(+x.closeCost||0)-(+x.fees||0)) )}</b></div>`).join('')||'<div class="empty">No trades yet.</div>'}</div>`;}
else if(page==='positions')v.innerHTML=`<div class="card"><div class="head"><h2>Positions</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="refreshLivePrices()">↻ Refresh Prices</button><button id="installBtn" class="btn" style="display:none" onclick="installApp()">Install</button><button class="btn primary" onclick="view('add')">+ Add Trade</button></div></div><p class="note">Current Price is pulled automatically from the internet when available and refreshed every 60 seconds. You can also type a price and press Save.</p><p class="note">Status: <span id="liveStatus">Ready</span></p>${table()}</div>`;
else if(page==='wheel'){let ids=[...new Set(D.trades.map(x=>x.wheel).filter(Boolean))];v.innerHTML=`<div class="card"><h2>Wheel Lifecycle</h2><p class="note">Each Wheel ID is shown in actual trade-date sequence. This lets you follow CSP → Assignment → next CSP → Covered Call, etc.</p>${ids.length?ids.map(id=>{let a=D.trades.filter(x=>x.wheel===id).sort((u,w)=>(u.date||'').localeCompare(w.date||'')||((+u.id||0)-(+w.id||0))),t=a[0].ticker,x=M(t),cspNo=0,ccNo=0,assignNo=0;let steps=a.map(z=>{let label=z.type;if(z.type==='CSP')label='CSP #'+(++cspNo);else if(z.type==='CC')label='Covered Call #'+(++ccNo);else if(z.type==='ASSIGN')label='Assigned '+(++assignNo);let value=z.type==='CSP'||z.type==='CC'?money(z.premium):((z.shares||0)+' shares');let cls=z.type==='CSP'||z.type==='CC'?'green':'';let dt=z.date?new Date(z.date+'T00:00:00').toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}):'No date';return`<div class="step"><span>${label}</span><br><b class="${cls}">${value}</b><small class="step-date">${dt}</small></div>`}).join('<span class="arrow">→</span>');let open=a.length?a[a.length-1].status:'';return`<div class="card" style="background:#091b2a"><div class="head"><b>${id} · ${t}</b><span class="pill">${open}</span></div><div class="timeline">${steps||'<span class="note">No lifecycle legs recorded.</span>'}</div><div class="three"><div><div class="label">Net premium</div><b class="green">${money(x.premium)}</b></div><div><div class="label">Adjusted/share</div><b>${money(x.ps)}</b></div><div><div class="label">Wheel P/L</div><b class="${x.total>=0?'green':'red'}">${money(x.total)}</b></div></div><div class="note" style="margin-top:12px">Trades: ${a.length} · CSP: ${cspNo} · Assignment: ${assignNo} · Covered Call: ${ccNo}</div></div>`}).join(''):'<div class="empty">Use the same Wheel ID to link each leg.</div>'}</div>`;}
else if(page==='leaps'){let rows=optionTrades('LEAPS'),groups=[...new Set(rows.map(x=>x.linkId||x.leapId).filter(Boolean))];v.innerHTML=`<div class="card"><div class="head"><h2>LEAPS / Averaging</h2><button class="btn primary" onclick="view('add')">+ Add LEAP Trade</button></div><p class="note">Track your long LEAP call, additional buys used to reduce average cost, and any later sale/close. Use the same LEAP ID for the same position.</p>${groups.length?groups.map(id=>{let a=rows.filter(x=>(x.linkId||x.leapId)===id).sort((u,w)=>(u.date||'').localeCompare(w.date||''));let buys=a.filter(x=>x.type==='BUY'),buyCost=buys.reduce((q,x)=>q+(+x.premium||0)+(+x.fees||0),0),qty=buys.reduce((q,x)=>q+(+x.contracts||+x.units||1),0),avg=qty?buyCost/qty:0,net=strategyCash('LEAPS');return`<div class="card" style="background:#091b2a"><div class="head"><b>${id}</b><span class="pill">${a[a.length-1].status||'Open'}</span></div><div class="three"><div><div class="label">LEAP contracts bought</div><b>${qty}</b></div><div><div class="label">Total buy cost</div><b>${money(buyCost)}</b></div><div><div class="label">Average cost / contract</div><b>${money(avg)}</b></div></div><div class="timeline">${a.map((x,i)=>`<div class="step"><span>${x.type}</span><br><b class="${x.type==='BUY'?'':'green'}">${money(x.premium)}</b><small class="step-date">${x.date||''}</small></div>${i<a.length-1?'<span class="arrow">→</span>':''}`).join('')}</div></div>`}).join(''):'<div class="empty">No LEAP ID yet. Add a LEAPS trade and enter a LEAP ID such as NVDA-LEAP-001.</div>'}</div>`}
else if(page==='spreads'){let rows=optionTrades('Vertical Spread'),groups=[...new Set(rows.map(x=>x.linkId||x.spreadId).filter(Boolean))];v.innerHTML=`<div class="card"><div class="head"><h2>Vertical LEAP Spreads</h2><button class="btn primary" onclick="view('add')">+ Add Spread Leg</button></div><p class="note">Designed for your structure: buy 1 ITM LEAP call + sell 1 OTM LEAP call. Use the same Spread ID for both legs.</p>${groups.length?groups.map(id=>{let a=rows.filter(x=>(x.linkId||x.spreadId)===id).sort((u,w)=>(u.date||'').localeCompare(w.date||''));let net=a.reduce((q,x)=>q+(x.type==='BUY'?-1:1)*(+x.premium||0)-(+x.closeCost||0)-(+x.fees||0),0);return`<div class="card" style="background:#091b2a"><div class="head"><b>${id}</b><span class="pill">${a[a.length-1].status||'Open'}</span></div><div class="timeline">${a.map((x,i)=>`<div class="step"><span>${x.type==='BUY'?'BUY ITM LEAP':'SELL OTM LEAP'}</span><br><b class="${x.type==='BUY'?'red':'green'}">${money(x.premium)}</b><small class="step-date">${x.date||''}</small></div>${i<a.length-1?'<span class="arrow">→</span>':''}`).join('')}</div><div class="three"><div><div class="label">Net cash flow</div><b class="${net>=0?'green':'red'}">${moneySigned(net)}</b></div><div><div class="label">Legs</div><b>${a.length}</b></div><div><div class="label">Ticker</div><b>${a[0].ticker}</b></div></div></div>`}).join(''):'<div class="empty">No Spread ID yet. Add both legs with the same Spread ID.</div>'}</div>`}
else if(page==='income'){let wheel=wheelIncForReport(),leap=strategyCash('LEAPS'),spread=strategyCash('Vertical Spread'),total=wheel+leap+spread;v.innerHTML=`<div class="card"><h2>Portfolio Option Income</h2><p class="note">Cash-flow view across your three strategies. LEAP purchases are shown as outflows; option sales and closed-option proceeds are shown as inflows.</p><div class="grid"><div class="card"><div class="label">Total</div><div class="value ${total>=0?'green':'red'}">${moneySigned(total)}</div></div><div class="card"><div class="label">Wheel</div><div class="value green">${moneySigned(wheel)}</div></div><div class="card"><div class="label">LEAPS</div><div class="value ${leap>=0?'green':'red'}">${moneySigned(leap)}</div></div><div class="card"><div class="label">Vertical Spread</div><div class="value ${spread>=0?'green':'red'}">${moneySigned(spread)}</div></div></div><div class="wrap"><table><tr><th>Date</th><th>Strategy</th><th>Ticker</th><th>Action</th><th>Link ID</th><th>Cash Flow</th><th>Fees</th></tr>${D.trades.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>{let cash=(x.type==='BUY'?-1:1)*(+x.premium||0)-(+x.closeCost||0)-(+x.fees||0);return`<tr><td>${x.date||''}</td><td>${strategyOf(x)}</td><td><b>${x.ticker}</b></td><td>${x.type}</td><td>${x.linkId||x.wheel||''}</td><td class="${cash>=0?'green':'red'}">${moneySigned(cash)}</td><td>${money(x.fees)}</td></tr>`}).join('')}</table></div></div>`}

else if(page==='expiry')v.innerHTML=`<div class="card"><div class="head"><h2>Option Expiry Monitor</h2><span class="muted">Based on expiry dates entered</span></div>${expiryRows(99)||'<div class="empty">No option expiry dates recorded.</div>'}</div>`;

function expiryRows(limit){let a=D.trades.filter(x=>['CSP','CC','BTC'].includes(x.type)&&x.expiry).map(x=>({...x,d:days(x.expiry)})).sort((a,b)=>a.d-b.d).slice(0,limit);if(!a.length)return'';return'<div class="wrap"><table><tr><th>Ticker</th><th>Type</th><th>Strike</th><th>Expiry</th><th>Time</th><th>Status</th><th>Wheel</th></tr>'+a.map(x=>`<tr><td><b>${x.ticker}</b></td><td>${x.type}</td><td>${money(x.strike)}</td><td>${x.expiry}</td><td class="${x.d<=3?'red':x.d<=7?'amber':'green'}"><b>${x.d<0?'Expired':x.d+' day(s)'}</b></td><td>${x.status}</td><td>${x.wheel||'-'}</td></tr>`).join('')+'</table></div>'}
function calc(){let t=$('#ct').value,x=M(t),strike=+$($('#cs')).value,p=+$('#cp').value,n=+$('#cn').value,total=p*100*n,newAdj=x.adj-total,sh=x.shares||100;$('#cr').innerHTML=`<div class="card" style="margin-top:12px;background:#091b2a"><div class="kpi"><span>New premium</span><b class="green">${money(total)}</b></div><div class="kpi"><span>New adjusted cost</span><b>${money(newAdj)}</b></div><div class="kpi"><span>New adjusted/share</span><b class="green">${money(newAdj/sh)}</b></div><div class="kpi"><span>If called: proceeds</span><b>${money(strike*sh)}</b></div></div>`}
function csv(){let h=['date','type','ticker','strike','shares','contracts','premium','closeCost','fees','expiry','status','wheel'],rows=D.trades.map(x=>h.map(k=>JSON.stringify(x[k]??'')).join(',')),b=new Blob([[h.join(','),...rows].join('\\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='wheel-tracker-v8.csv';a.click()}
view('home');startLivePrices();

function editTrade(id){
  const x=D.trades.find(z=>z.id===id);
  if(!x)return;
  view('add',id);
}
function deleteTrade(id){
  const x=D.trades.find(z=>z.id===id);
  if(!x)return;
  if(!confirm(`Delete ${x.ticker} ${x.type} trade from ${x.date||'this date'}?`))return;
  D.trades=D.trades.filter(z=>z.id!==id);
  if(D.prices[x.ticker]!==undefined && !D.trades.some(z=>z.ticker===x.ticker))delete D.prices[x.ticker];
  save();
  view('tx');
}
function deleteTickerTrades(t){
  const count=D.trades.filter(x=>x.ticker===t).length;
  if(!count)return;
  if(!confirm(`Delete all ${count} ${t} trade(s)? This cannot be undone.`))return;
  D.trades=D.trades.filter(x=>x.ticker!==t);
  delete D.prices[t];
  save();
  view('positions');
}

function saveTrade(editId){
  try{
    const strategy=$('#strategy').value,type=$('#type').value,t=$('#ticker').value.trim().toUpperCase(),strike=+$('#strike').value||0,u=+$('#units').value||0,p=+$('#premium').value||0,b=+$('#btc').value||0,f=+$('#fees').value||0;
    if(!t){alert('Enter ticker');return}
    if(u<=0){alert('Enter contracts/shares greater than 0');return}
    const link=$('#linkid').value.trim();
    const data={
      id:editId?+editId:Date.now(),
      strategy,type,ticker:t,strike,
      units:u,
      shares:strategy==='Wheel'&&['ASSIGN','BUY','SELL','CALLED'].includes(type)?u:0,
      contracts:strategy==='Wheel'&&['CSP','CC','BTC'].includes(type)?u:u,
      premium:p,closeCost:b,fees:f,
      date:$('#date').value,expiry:$('#expiryDate').value,
      status:$('#status').value,
      wheel:strategy==='Wheel'?link:'',
      linkId:strategy!=='Wheel'?link:''
    };
    if(editId){
      const i=D.trades.findIndex(x=>x.id===+editId);
      if(i<0){alert('Trade not found');return}
      D.trades[i]=data;
    }else D.trades.push(data);
    save(); view('tx');
  }catch(err){console.error(err);alert('Could not save this trade. Please refresh and try again.')}
}
