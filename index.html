<!doctype html><html><head><meta charset="utf-8">
<meta name="theme-color" content="#07131f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wheel Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Wheel Tracker V4</title>
<style>
:root{--bg:#07131f;--card:#0e2438;--card2:#122d45;--text:#f5f8fb;--muted:#91a8bb;--line:#1e405a;--green:#35e09a;--red:#ff6b6b;--blue:#69b8ff;--amber:#f4c95d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#05101a,#0b2032);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}.app{max-width:1150px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:800}.muted,.note{color:var(--muted);font-size:12px}.nav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.nav button,.btn{background:var(--card);border:1px solid var(--line);color:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.active,.primary{background:var(--green)!important;color:#052016!important;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:rgba(14,36,56,.97);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px}.label{color:var(--muted);font-size:11px}.value{font-size:22px;font-weight:800;margin-top:4px}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px}.kpi{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.kpi:last-child{border:0}.pill{padding:4px 8px;border-radius:20px;background:#12364e;font-size:10px}.status-open{color:var(--blue)}.status-good{color:var(--green)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted)}.wrap{overflow:auto}.wrap table{min-width:850px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{color:var(--muted);font-size:11px}input,select,textarea{width:100%;margin-top:5px;padding:10px;background:#081a29;color:#fff;border:1px solid var(--line);border-radius:8px}.full{grid-column:1/-1}.actions{text-align:right;margin-top:12px}.empty{text-align:center;padding:26px;color:var(--muted)}.timeline{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:10px 0}.step{background:#12344b;border:1px solid var(--line);padding:8px 10px;border-radius:9px;font-size:11px}.arrow{color:var(--muted)}.bar{height:8px;background:#12324a;border-radius:20px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--green)}.mini{font-size:11px}.danger{border-color:#69303b!important;background:#341c25!important}@media(max-width:760px){.grid,.three{grid-template-columns:1fr 1fr}.two,.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="app">
<div class="top"><div><div class="brand">◉ Wheel Tracker <span class="pill">V4</span></div><div class="muted">Wheel lifecycle • cost basis • premium ROI • expiry management</div></div><button id="installBtn" class="btn" style="display:none" onclick="installApp()">Install</button><button class="btn primary" onclick="view('add')">+ Add Trade</button></div>
<div class="nav"><button id="home" onclick="view('home')">Home</button><button id="positions" onclick="view('positions')">Positions</button><button id="wheel" onclick="view('wheel')">Wheel</button><button id="expiry" onclick="view('expiry')">Expiry</button><button id="calc" onclick="view('calc')">What-If</button><button id="reports" onclick="view('reports')">Reports</button><button id="tx" onclick="view('tx')">Trades</button><button id="more" onclick="view('more')">More</button></div><div id="v"></div></div>
<script>
const KEY='wheeltracker_v4';
let D=JSON.parse(localStorage.getItem(KEY)||'null')||{trades:[
{id:1,type:'CSP',ticker:'AAPL',strike:200,contracts:1,premium:500,closeCost:0,fees:20,status:'Assigned',date:'2026-09-15',expiry:'2026-10-16',wheel:'AAPL-001'},
{id:2,type:'ASSIGN',ticker:'AAPL',strike:200,shares:100,premium:0,closeCost:0,fees:0,status:'Open',date:'2026-10-16',wheel:'AAPL-001'},
{id:3,type:'CC',ticker:'AAPL',strike:210,contracts:1,premium:700,closeCost:0,fees:20,status:'Open',date:'2026-10-16',expiry:'2026-11-20',wheel:'AAPL-001'}],prices:{AAPL:195}};
const $=s=>document.querySelector(s), money=n=>'$'+(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}), pct=n=>((+n||0)*100).toFixed(2)+'%';
function save(){localStorage.setItem(KEY,JSON.stringify(D))} function stocks(){return[...new Set(D.trades.map(x=>x.ticker).filter(Boolean))]}
function M(t){let a=D.trades.filter(x=>x.ticker===t),put=0,call=0,btc=0,fees=0,cost=0,proceeds=0,shares=0;
a.forEach(x=>{fees+=+x.fees||0;if(x.type==='CSP')put+=+x.premium||0;if(x.type==='CC')call+=+x.premium||0;if(x.type==='BTC')btc+=+x.closeCost||0;if(['ASSIGN','BUY'].includes(x.type)){shares+=+x.shares||0;cost+=(+x.shares||0)*(+x.strike||0)}if(['SELL','CALLED'].includes(x.type)){shares-=+x.shares||0;proceeds+=(+x.shares||0)*(+x.strike||0)}});let premium=put+call-btc-fees,adj=cost-premium,price=+D.prices[t]||0,market=shares*price,unreal=market-adj,real=proceeds+premium-cost;return{put,call,btc,fees,cost,premium,adj,shares,price,market,unreal,real,total:real+unreal,ps:shares?adj/shares:0}}
function nav(id){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if($('#'+id))$('#'+id).classList.add('active')}
function table(){if(!stocks().length)return'<div class="empty">No trades yet.</div>';return'<div class="wrap"><table><tr><th>Stock</th><th>Shares</th><th>Actual Cost</th><th>Net Premium</th><th>Adjusted Cost</th><th>Adj./Share</th><th>Price</th><th>Total P/L</th></tr>'+stocks().map(t=>{let x=M(t);return`<tr><td><b>${t}</b></td><td>${x.shares}</td><td>${money(x.cost)}</td><td class="green">${money(x.premium)}</td><td>${money(x.adj)}</td><td>${money(x.ps)}</td><td>${money(x.price)}</td><td class="${x.total>=0?'green':'red'}">${money(x.total)}</td></tr>`}).join('')+'</table></div>'}
function days(exp){if(!exp)return null;return Math.ceil((new Date(exp+'T23:59:59')-new Date())/86400000)}
function view(page){nav(page);let v=$('#v'),p=stocks().map(M),prem=p.reduce((a,x)=>a+x.premium,0),market=p.reduce((a,x)=>a+x.market,0),adj=p.reduce((a,x)=>a+x.adj,0),pl=p.reduce((a,x)=>a+x.total,0);
if(page==='home')v.innerHTML=`<div class="grid"><div class="card"><div class="label">Market Value</div><div class="value">${money(market)}</div></div><div class="card"><div class="label">Net Premium</div><div class="value green">${money(prem)}</div></div><div class="card"><div class="label">Adjusted Cost</div><div class="value">${money(adj)}</div></div><div class="card"><div class="label">Total P/L</div><div class="value ${pl>=0?'green':'red'}">${money(pl)}</div></div></div>
<div class="two"><div class="card"><h2>Wheel Income</h2><div class="kpi"><span>CSP premium</span><b class="green">${money(p.reduce((a,x)=>a+x.put,0))}</b></div><div class="kpi"><span>Covered calls</span><b class="green">${money(p.reduce((a,x)=>a+x.call,0))}</b></div><div class="kpi"><span>Buy-to-close</span><b class="red">-${money(p.reduce((a,x)=>a+x.btc,0))}</b></div><div class="kpi"><span>Fees</span><b>-${money(p.reduce((a,x)=>a+x.fees,0))}</b></div></div>
<div class="card"><h2>Quick Stats</h2><div class="kpi"><span>Active shares</span><b>${p.reduce((a,x)=>a+x.shares,0)}</b></div><div class="kpi"><span>Active positions</span><b>${p.filter(x=>x.shares>0).length}</b></div><div class="kpi"><span>Wheel cycles</span><b>${new Set(D.trades.map(x=>x.wheel).filter(Boolean)).size}</b></div><div class="kpi"><span>Premium / stock cost</span><b class="green">${pct(p.reduce((a,x)=>a+(x.cost?x.premium/x.cost:0),0))}</b></div></div></div>
<div class="card"><div class="head"><h2>Positions</h2><button class="btn" onclick="view('positions')">View all</button></div>${table()}</div>
<div class="card"><div class="head"><h2>Upcoming Expiries</h2><button class="btn" onclick="view('expiry')">View</button></div>${expiryRows(3)}</div>`;
else if(page==='positions')v.innerHTML=`<div class="card"><div class="head"><h2>Positions</h2><button id="installBtn" class="btn" style="display:none" onclick="installApp()">Install</button><button class="btn primary" onclick="view('add')">+ Add Trade</button></div>${table()}</div>`;
else if(page==='wheel'){let ids=[...new Set(D.trades.map(x=>x.wheel).filter(Boolean))];v.innerHTML=`<div class="card"><h2>Wheel Lifecycle</h2>${ids.length?ids.map(id=>{let a=D.trades.filter(x=>x.wheel===id),t=a[0].ticker,x=M(t),c=a.find(z=>z.type==='CSP'),as=a.find(z=>z.type==='ASSIGN'),cc=a.find(z=>z.type==='CC'),last=a[a.length-1];return`<div class="card" style="background:#091b2a"><div class="head"><b>${id} · ${t}</b><span class="pill">${last.status}</span></div><div class="timeline"><div class="step">CSP<br><b class="green">${money(c?.premium)}</b></div><span class="arrow">→</span><div class="step">Assignment<br><b>${as?.shares||0} shares</b></div><span class="arrow">→</span><div class="step">Covered Call<br><b class="green">${money(cc?.premium)}</b></div></div><div class="three"><div><div class="label">Net premium</div><b class="green">${money(x.premium)}</b></div><div><div class="label">Adjusted/share</div><b>${money(x.ps)}</b></div><div><div class="label">Wheel P/L</div><b class="${x.total>=0?'green':'red'}">${money(x.total)}</b></div></div></div>`}).join(''):'<div class="empty">Use the same Wheel ID to link each leg.</div>'}</div>`;
else if(page==='expiry')v.innerHTML=`<div class="card"><div class="head"><h2>Option Expiry Monitor</h2><span class="muted">Based on expiry dates entered</span></div>${expiryRows(99)||'<div class="empty">No option expiry dates recorded.</div>'}</div>`;
else if(page==='calc')v.innerHTML=`<div class="two"><div class="card"><h2>Wheel What-If</h2><div class="form"><div><label>Stock</label><select id="ct">${stocks().map(t=>`<option>${t}</option>`).join('')||'<option>AAPL</option>'}</select></div><div><label>Call strike</label><input id="cs" type="number" value="210"></div><div><label>Premium/share</label><input id="cp" type="number" step=".01" value="3"></div><div><label>Contracts</label><input id="cn" type="number" value="1"></div></div><div class="actions"><button class="btn primary" onclick="calc()">Calculate</button></div><div id="cr"></div></div><div class="card"><h2>How to use</h2><p class="note">Use this before selling the next covered call. The app estimates the new adjusted cost after premium and shows the potential sale proceeds if assigned.</p></div></div>`;
else if(page==='reports'){let real=p.reduce((a,x)=>a+x.real,0),unreal=p.reduce((a,x)=>a+x.unreal,0);v.innerHTML=`<div class="grid"><div class="card"><div class="label">Net Premium</div><div class="value green">${money(prem)}</div></div><div class="card"><div class="label">Realized P/L</div><div class="value">${money(real)}</div></div><div class="card"><div class="label">Unrealized P/L</div><div class="value">${money(unreal)}</div></div><div class="card"><div class="label">Total P/L</div><div class="value ${pl>=0?'green':'red'}">${money(pl)}</div></div></div><div class="card"><h2>By Stock</h2>${table()}</div>`}
else if(page==='tx')v.innerHTML=`<div class="card"><div class="head"><h2>Trades</h2><button class="btn" onclick="csv()">Export CSV</button></div><div class="wrap"><table><tr><th>Date</th><th>Type</th><th>Ticker</th><th>Strike</th><th>Premium</th><th>BTC</th><th>Fees</th><th>Expiry</th><th>Status</th><th>Wheel</th></tr>${D.trades.slice().reverse().map(x=>`<tr><td>${x.date||''}</td><td><span class="pill">${x.type}</span></td><td>${x.ticker}</td><td>${x.strike?money(x.strike):'-'}</td><td class="green">${x.premium?money(x.premium):'-'}</td><td>${x.closeCost?money(x.closeCost):'-'}</td><td>${money(x.fees)}</td><td>${x.expiry||'-'}</td><td>${x.status||''}</td><td>${x.wheel||'-'}</td></tr>`).join('')}</table></div></div>`;
else if(page==='add')v.innerHTML=`<div class="card"><h2>Add Trade</h2><div class="form"><div><label>Type</label><select id="type"><option>CSP</option><option>CC</option><option>BTC</option><option>ASSIGN</option><option>BUY</option><option>SELL</option><option>CALLED</option></select></div><div><label>Ticker</label><input id="ticker" value="AAPL"></div><div><label>Strike / Price</label><input id="strike" type="number" step=".01" value="200"></div><div><label>Contracts / Shares</label><input id="units" type="number" value="1"></div><div><label>Total premium received</label><input id="premium" type="number" step=".01" value="0"></div><div><label>Buy-to-close cost</label><input id="btc" type="number" step=".01" value="0"></div><div><label>Fees</label><input id="fees" type="number" step=".01" value="0"></div><div><label>Trade date</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Expiry</label><input id="expiryDate" type="date"></div><div><label>Status</label><select id="status"><option>Open</option><option>Expired</option><option>Assigned</option><option>Closed</option><option>Called Away</option></select></div><div><label>Wheel ID</label><input id="wheelid" placeholder="AAPL-001"></div><div class="full note">For options enter total premium. Example: $3/share × 100 × 1 contract = $300. Use one Wheel ID for all legs of the same Wheel cycle.</div></div><div class="actions"><button class="btn primary" onclick="add()">Save Trade</button></div></div>`;
else if(page==='more')v.innerHTML=`<div class="two"><div class="card"><h2>Data Backup</h2><p class="note">V4 stores data locally in this browser. Export CSV regularly if you want a backup.</p><button class="btn" onclick="csv()">Export CSV</button></div><div class="card"><h2>Reset</h2><p class="note">Deletes locally stored V4 data.</p><button class="btn danger" onclick="if(confirm('Delete all V4 data?')){localStorage.removeItem(KEY);location.reload()}">Reset data</button></div></div>`;
}
function expiryRows(limit){let a=D.trades.filter(x=>['CSP','CC','BTC'].includes(x.type)&&x.expiry).map(x=>({...x,d:days(x.expiry)})).sort((a,b)=>a.d-b.d).slice(0,limit);if(!a.length)return'';return'<div class="wrap"><table><tr><th>Ticker</th><th>Type</th><th>Strike</th><th>Expiry</th><th>Time</th><th>Status</th><th>Wheel</th></tr>'+a.map(x=>`<tr><td><b>${x.ticker}</b></td><td>${x.type}</td><td>${money(x.strike)}</td><td>${x.expiry}</td><td class="${x.d<=3?'red':x.d<=7?'amber':'green'}"><b>${x.d<0?'Expired':x.d+' day(s)'}</b></td><td>${x.status}</td><td>${x.wheel||'-'}</td></tr>`).join('')+'</table></div>'}
function add(){let type=$('#type').value,t=$('#ticker').value.trim().toUpperCase(),s=+$('#strike').value||0,u=+$('#units').value||0,p=+$('#premium').value||0,b=+$('#btc').value||0,f=+$('#fees').value||0;if(!t){alert('Enter ticker');return}D.trades.push({id:Date.now(),type,ticker:t,strike:s,shares:['ASSIGN','BUY','SELL','CALLED'].includes(type)?u:0,contracts:['CSP','CC','BTC'].includes(type)?u:0,premium:p,closeCost:b,fees:f,date:$('#date').value,expiry:$('#expiryDate').value,status:$('#status').value,wheel:$('#wheelid').value.trim()});if(['ASSIGN','BUY'].includes(type))D.prices[t]=s;save();view('home')}
function calc(){let t=$('#ct').value,x=M(t),strike=+$($('#cs')).value,p=+$('#cp').value,n=+$('#cn').value,total=p*100*n,newAdj=x.adj-total,sh=x.shares||100;$('#cr').innerHTML=`<div class="card" style="margin-top:12px;background:#091b2a"><div class="kpi"><span>New premium</span><b class="green">${money(total)}</b></div><div class="kpi"><span>New adjusted cost</span><b>${money(newAdj)}</b></div><div class="kpi"><span>New adjusted/share</span><b class="green">${money(newAdj/sh)}</b></div><div class="kpi"><span>If called: proceeds</span><b>${money(strike*sh)}</b></div></div>`}
function csv(){let h=['date','type','ticker','strike','shares','contracts','premium','closeCost','fees','expiry','status','wheel'],rows=D.trades.map(x=>h.map(k=>JSON.stringify(x[k]??'')).join(',')),b=new Blob([[h.join(','),...rows].join('\\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='wheel-tracker-v4.csv';a.click()}
view('home');
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;let b=document.getElementById('installBtn');if(b)b.style.display='inline-block'});
async function installApp(){if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;let b=document.getElementById('installBtn');if(b)b.style.display='none'}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
